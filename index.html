<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PD2 Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body x-data="app()">

<header class="top">
  <div class="top-inner">
    <a class="brand" href="#runewords">PD2 Sheet</a>
    <nav class="tabs" aria-label="Sections">
      <template x-for="t in tabs" :key="t[0]">
        <a :href="'#' + t[0]" x-text="t[1]" :aria-current="tab === t[0] ? 'page' : null"></a>
      </template>
    </nav>
  </div>
</header>

<main x-cloak>
  <p x-show="loading" class="empty">Loading data…</p>
  <p x-show="error" x-text="error" class="empty t-red"></p>

  <!-- ================= Runewords ================= -->
  <section x-show="tab === 'runewords' && !loading" aria-labelledby="h-rw">
    <div class="filters">
      <input type="search" placeholder="Search name, rune, bonus…" x-model="rw.q" aria-label="Search runewords">
      <div class="seg" role="group" aria-label="Sockets">
        <span class="tag" style="align-self: center; margin-right: .2rem">Sockets</span>
        <button @click="rw.sockets = ''" :aria-pressed="rw.sockets === ''">Any</button>
        <template x-for="n in [2,3,4,5,6]" :key="n">
          <button @click="rw.sockets = n" :aria-pressed="rw.sockets === n" x-text="n"></button>
        </template>
      </div>
      <input type="text" placeholder="Rune, e.g. Ber" x-model="rw.rune" size="12" aria-label="Filter by rune">
      <select x-model="rw.type" aria-label="Item type">
        <option value="">All item types</option>
        <template x-for="t in rwTypes" :key="t"><option :value="t" x-text="t"></option></template>
      </select>
      <select x-model="rw.sort" aria-label="Sort by">
        <option value="default">Sort: Wiki order</option>
        <option value="name">Sort: Name</option>
        <option value="level">Sort: Required level</option>
        <option value="sockets">Sort: Sockets</option>
      </select>
      <button class="btn" @click="resetRw()">Reset</button>
      <span class="count" x-text="rwList.length + ' of ' + runewords.length"></span>
    </div>
    <div class="grid">
      <template x-for="r in rwList" :key="r.Name">
        <article class="card">
          <h3 x-text="r.Name"></h3>
          <p class="meta" x-text="r.ItemType + ' · ' + r.Sockets + ' sockets · clvl ' + r.CharacterLevel"></p>
          <div class="chips">
            <template x-for="(rune, i) in r.Runes" :key="i"><span class="chip" x-text="rune"></span></template>
          </div>
          <ul class="mods">
            <template x-for="(b, i) in r.Bonuses" :key="i"><li x-html="fmt(b)"></li></template>
          </ul>
        </article>
      </template>
    </div>
    <p class="empty" x-show="!rwList.length">No runeword matches these filters.</p>
  </section>

  <!-- ================= Crafting ================= -->
  <section x-show="tab === 'crafting' && !loading" aria-labelledby="h-cr">
 <div class="filters">
      <input type="search" placeholder="Search stat, rune, gem…" x-model="cr.q" aria-label="Search crafts">
      <div class="seg" role="group" aria-label="Craft type">
        <button @click="cr.type = ''" :aria-pressed="cr.type === ''">All types</button>
        <template x-for="t in craft.types" :key="t">
          <button @click="cr.type = t" :aria-pressed="cr.type === t" x-text="t"></button>
        </template>
      </div>
      <select x-model="cr.slot" aria-label="Item slot">
        <option value="">All slots</option>
        <template x-for="s in craft.slots" :key="s.slot"><option :value="s.slot" x-text="s.slot"></option></template>
      </select>
      <button class="btn" @click="cr = { q: '', type: '', slot: '' }">Reset</button>
      <span class="count" x-text="crList.length + ' crafts'"></span>
    </div>
    <div class="grid">
      <template x-for="c in crList" :key="c.type + c.slot">
        <article class="card">
          <h3 x-text="c.type + ' ' + c.slot"></h3>
          <div class="chips" style="margin-top: .6rem">
            <span class="chip c-orange" x-text="c.rune"></span><span class="plus">+</span>
            <span class="chip" :class="'c-' + c.gemColor" x-text="c.gem"></span>
          </div>
          <ul class="mods"><template x-for="(m, i) in c.mods" :key="i"><li x-html="fmt(m)"></li></template></ul>
        </article>
      </template>
    </div>
    <p class="empty" x-show="!crList.length">No craft matches these filters.</p>
  </section>

  <!-- ================= Cube Recipes ================= -->
  <section x-show="tab === 'cube' && !loading" aria-labelledby="h-cu">
  <div class="filters">
      <input type="search" placeholder="Search result or ingredient…" x-model="cu.q" aria-label="Search recipes">
      <div class="seg" role="group" aria-label="Category">
        <button @click="cu.cat = ''" :aria-pressed="cu.cat === ''">All</button>
        <template x-for="c in cuCats" :key="c">
          <button @click="cu.cat = c" :aria-pressed="cu.cat === c" x-text="c"></button>
        </template>
      </div>
      <button class="btn" @click="cu = { q: '', cat: '' }">Reset</button>
      <span class="count" x-text="cuList.length + ' recipes'"></span>
    </div>
    <div class="grid">
      <template x-for="(r, n) in cuList" :key="r.Category + n">
        <article class="card">
          <p class="tag" x-text="r.Category" style="margin: 0 0 .5rem"></p>
          <div class="ing">
            <template x-for="(i, k) in r.Ingridients" :key="k">
              <div>
                <span class="plus" x-show="k > 0">+</span>
                <span class="chip plain" :class="i.cls && 'c-' + i.cls" x-text="i.name"></span>
              </div>
            </template>
          </div>
          <template x-for="(i, k) in r.Ingridients.filter(x => x.info)" :key="k">
            <p class="info" style="margin: .35rem 0 0"><b x-text="i.name + ': '"></b><span x-text="i.info"></span></p>
          </template>
          <div class="result">
            <b x-text="r.Result"></b>
            <p class="note" x-show="r.Notes" x-text="r.Notes"></p>
          </div>
        </article>
      </template>
    </div>
    <p class="empty" x-show="!cuList.length">No recipe matches these filters.</p>
  </section>

  <!-- ================= Corruptions ================= -->
  <section x-show="tab === 'corruptions' && !loading" aria-labelledby="h-co">
 <div class="filters">
      <input type="search" placeholder="Search a modifier…" x-model="co.q" aria-label="Search corruptions">
      <div class="seg" role="group" aria-label="Category">
        <button @click="co.cat = ''" :aria-pressed="co.cat === ''">All</button>
        <template x-for="c in corruptions" :key="c.Category">
          <button @click="co.cat = c.Category" :aria-pressed="co.cat === c.Category" x-text="c.Category"></button>
        </template>
      </div>
      <button class="btn" @click="co = { q: '', cat: '' }">Reset</button>
    </div>
    <div style="display: grid; gap: .9rem">
      <template x-for="c in coList" :key="c.name">
        <article class="card">
          <h3 x-text="c.name" style="margin-bottom: .7rem"></h3>
          <div class="cols">
            <template x-for="col in c.cols" :key="col[0]">
              <div>
                <h4 x-text="col[0] + ' (' + col[1] + ')'"></h4>
                <div class="bar" :style="'width:' + (col[1] === '~50%' ? 100 : col[1] === '~30%' ? 60 : 40) + '%'"></div>
                <ul class="mods"><template x-for="(m, i) in col[2]" :key="i"><li x-html="fmt(m)"></li></template></ul>
              </div>
            </template>
          </div>
        </article>
      </template>
    </div>
    <p class="empty" x-show="!coList.length">No corruption matches these filters.</p>
  </section>

  <!-- ================= Unique Weapons ================= -->
  <section x-show="tab === 'weapons' && !loading" aria-labelledby="h-uw">
   <div class="filters">
      <input type="search" placeholder="Search name or bonus…" x-model="uw.q" aria-label="Search weapons">
      <div class="seg" role="group" aria-label="Weapon type">
        <button @click="uw.type = ''" :aria-pressed="uw.type === ''">All types</button>
        <template x-for="t in uwTypes" :key="t">
          <button @click="uw.type = t" :aria-pressed="uw.type === t" x-text="t"></button>
        </template>
      </div>
      <div class="seg" role="group" aria-label="Hands" x-show="uwHands.length > 1">
        <template x-for="h in uwHands" :key="h">
          <button @click="uw.hand = uw.hand === h ? '' : h" :aria-pressed="uw.hand === h" x-text="h"></button>
        </template>
      </div>
      <button class="btn" @click="uw = { q: '', type: '', hand: '' }">Reset</button>
      <span class="count" x-text="uwList.length + ' of ' + weapons.length"></span>
    </div>
    <div class="grid">
      <template x-for="w in uwList" :key="w.Name">
        <article class="card">
          <h3 x-text="w.Name"></h3>
          <p class="meta" x-text="w.Type + (w.RequiredLevel ? ' · req. level ' + w.RequiredLevel : '')"></p>
          <dl class="stats">
            <template x-for="s in uwStats(w)" :key="s[0]">
              <div><dt x-text="s[0]"></dt><dd x-text="s[1]"></dd></div>
            </template>
          </dl>
          <ul class="mods"><template x-for="(b, i) in w.Bonuses" :key="i"><li x-html="fmt(b)"></li></template></ul>
        </article>
      </template>
    </div>
    <p class="empty" x-show="!uwList.length">No weapon matches these filters.</p>
  </section>

  <!-- ================= Uber Bosses ================= -->
  <section x-show="tab === 'bosses' && !loading" aria-labelledby="h-bo">
   <div class="filters">
      <div class="seg" role="group" aria-label="Boss">
        <template x-for="(b, i) in bosses" :key="b.name">
          <button @click="boss = i" :aria-pressed="boss === i" x-text="b.name"></button>
        </template>
      </div>
    </div>
    <template x-if="bosses[boss]">
      <table class="resists">
        <tbody>
          <template x-for="r in bosses[boss].resists" :key="r.name">
            <tr>
              <td :class="'t-' + (RESIST_COLOR[r.name] || 'white')" x-text="r.name"></td>
              <td x-text="r.target"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>
  </section>
</main>

<footer class="foot">
  Info taken from the <a href="https://wiki.projectdiablo2.com/wiki">PD2 Wiki</a>.
</footer>

</body>
</html>
